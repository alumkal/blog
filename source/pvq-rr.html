<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PVQ-RR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --paper:#FBFAF8;
  --ink:#262B3F;
  --ink-soft:#6E7285;
  --line:#E5E2DA;
  --line-strong:#C9C5BA;
  --focus:#3D5A80;
  --q-openness:#D98E2B;
  --q-enhancement:#BC5A5C;
  --q-conservation:#4C7CA8;
  --q-transcendence:#5B9A74;
  --q-face:#96597E;
  --q-humility:#4F8D91;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.6;
}
html[lang="zh-CN"] body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}

button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
:focus:not(:focus-visible){outline:none}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:36rem;margin:0 auto;padding:.7rem 1.25rem;display:flex;align-items:center;justify-content:space-between}
.wordmark{font-family:Literata,Georgia,serif;font-weight:600;font-size:1.05rem;letter-spacing:.02em}
.lang-toggle{display:flex;gap:0;border:1px solid var(--line-strong);border-radius:.4rem;overflow:hidden}
.lang-toggle button{border:none;background:transparent;padding:.3rem .7rem;font-size:.8125rem;font-weight:500;cursor:pointer;color:var(--ink-soft)}
.lang-toggle button[aria-pressed="true"]{background:var(--focus);color:#fff}

main{max-width:36rem;margin:0 auto;padding:2.25rem 1.25rem 4rem}

/* ---- typography ---- */
.eyebrow{
  font-family:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
  font-size:.6875rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 .4rem;
}
html[lang="zh-CN"] .eyebrow{text-transform:none;letter-spacing:.25em}
.screen-title{font-family:Literata,Georgia,serif;font-weight:600;font-size:1.6rem;line-height:1.35;margin:0 0 .75rem}
html[lang="zh-CN"] .screen-title{font-family:"Songti SC","Noto Serif CJK SC","SimSun",serif}
.item-text{
  font-family:Literata,Georgia,serif;font-weight:500;
  font-size:clamp(1.35rem,2.6vw,1.75rem);line-height:1.5;margin:0 0 2rem;
}
html[lang="zh-CN"] .item-text{font-family:"Songti SC","Noto Serif CJK SC","SimSun",serif;font-weight:600}
.num-data{font-family:"IBM Plex Sans",sans-serif;font-weight:500;font-variant-numeric:tabular-nums}
.soft{color:var(--ink-soft)}
p{margin:0 0 1rem}

/* ---- progress ---- */
.progress{height:2px;background:var(--line);border-radius:1px;margin:.4rem 0 2.25rem}
.progress i{display:block;height:100%;background:var(--focus);transition:width .2s ease}

/* ---- buttons ---- */
.btn{
  display:inline-block;padding:.8rem 1.6rem;border-radius:.55rem;
  border:1px solid var(--focus);background:var(--focus);color:#fff;
  font-size:1rem;font-weight:500;cursor:pointer;
}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--focus)}
.linkish{background:none;border:none;color:var(--focus);cursor:pointer;font-size:.9375rem;padding:.2rem 0;text-decoration:underline;text-underline-offset:3px}

/* ---- start screen ---- */
.subtitle{font-family:Literata,Georgia,serif;font-size:1.05rem;color:var(--ink-soft);margin:0 0 1.5rem}
html[lang="zh-CN"] .subtitle{font-family:"Songti SC","Noto Serif CJK SC","SimSun",serif}
.instructions{border-left:2px solid var(--line-strong);padding-left:1rem;margin:0 0 2rem}
.wording{margin:0 0 2rem}
.wording-btns{display:flex;gap:.75rem;flex-wrap:wrap;margin:.6rem 0 .4rem}
.wording-btns button{
  flex:1 1 12rem;display:flex;align-items:center;gap:.7rem;min-height:56px;
  padding:.6rem 1rem;border:1px solid var(--line);border-radius:.55rem;
  background:#fff;cursor:pointer;text-align:left;font-size:.9375rem;
}
.wording-btns button .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);flex:none;background:#fff}
.wording-btns button[aria-pressed="true"]{border-color:var(--focus)}
.wording-btns button[aria-pressed="true"] .dot{border-color:var(--focus);background:var(--focus);box-shadow:inset 0 0 0 3px #fff}
.warn{color:#A0522D;font-size:.875rem;margin:.2rem 0 0}
.privacy{font-size:.875rem;color:var(--ink-soft)}
.start-actions{display:flex;align-items:center;gap:1.25rem;margin:1.5rem 0 0;flex-wrap:wrap}

/* ---- item screen ---- */
.item-anim{animation:item-in 160ms ease-out}
@keyframes item-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.options{display:flex;flex-direction:column;gap:.5rem;margin:.75rem 0 1.75rem}
.opt{
  display:flex;align-items:center;gap:.8rem;min-height:56px;width:100%;
  padding:.55rem 1rem;border:1px solid var(--line);border-radius:.55rem;
  background:#fff;cursor:pointer;text-align:left;font-size:1rem;
}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);flex:none;background:#fff}
.opt[aria-checked="true"]{border-color:var(--focus)}
.opt[aria-checked="true"] .dot{border-color:var(--focus);background:var(--focus);box-shadow:inset 0 0 0 3px #fff}
.opt .num{display:none}
@media(min-width:560px){
  .opt .num{
    display:flex;align-items:center;justify-content:center;flex:none;
    width:22px;height:22px;border:1px solid var(--line);border-radius:5px;
    font-size:.75rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;
  }
}
.item-footer{display:flex;justify-content:space-between;align-items:center;font-size:.875rem;color:var(--ink-soft)}
@media(pointer:coarse){.key-hint{display:none}}

/* ---- review ---- */
.gap-list{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1.75rem}
.gap-list button{
  padding:.45rem .8rem;border:1px solid var(--line-strong);border-radius:.45rem;
  background:#fff;cursor:pointer;font-size:.875rem;color:var(--focus);
}
.helper{font-size:.875rem;color:var(--ink-soft);margin:.6rem 0 0}

/* ---- results ---- */
.wheel-wrap{width:min(92vw,560px);margin:1.25rem auto 1rem}
.wheel-wrap svg{display:block;width:100%;height:auto}
.sector{animation:sector-in 500ms cubic-bezier(0.22,1,0.36,1) both}
.sector.neg{fill-opacity:.45}
.sector.sel{stroke:var(--ink);stroke-width:1.5}
@keyframes sector-in{from{transform:scale(0)}to{transform:scale(1)}}
.hit{fill:transparent;cursor:pointer}
.rim-label{font-size:11px;fill:var(--ink-soft)}
html[lang="zh-CN"] .rim-label{font-size:14px}
.qname{font-size:16px;font-weight:600}
.hub-name{font-size:12px;fill:var(--ink-soft);letter-spacing:.08em;paint-order:stroke;stroke:var(--paper);stroke-width:3px}
.hub-num{font-size:22px;font-weight:500;fill:var(--ink);font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--paper);stroke-width:4px}
@media(max-width:559px){.rim-label,.qname{display:none}}

.detail{border:1px solid var(--line);border-radius:.75rem;padding:1.1rem 1.25rem;margin:0 0 2rem;background:#fff}
.detail-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin:0 0 .3rem}
.detail-head h3{font-family:Literata,Georgia,serif;font-size:1.1rem;font-weight:600;margin:0}
html[lang="zh-CN"] .detail-head h3{font-family:"Songti SC","Noto Serif CJK SC","SimSun",serif}
.swatch{display:inline-block;width:11px;height:11px;border-radius:3px;flex:none;align-self:center}
.detail-scores{font-size:.8125rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.detail-def{font-size:.9375rem;color:var(--ink-soft);margin:0 0 .9rem}
.detail-items{list-style:none;margin:0;padding:0}
.detail-items li{display:flex;justify-content:space-between;gap:1rem;padding:.45rem 0;border-top:1px solid var(--line);font-size:.875rem}
.detail-items .di-rating{white-space:nowrap;color:var(--ink-soft);font-variant-numeric:tabular-nums}

.rank{margin:0 0 2.25rem}
.rank-head,.rank-row{
  display:grid;grid-template-columns:12px minmax(0,10rem) 1fr 3.4rem 3.2rem;
  gap:.6rem;align-items:center;
}
.rank-head{font-size:.6875rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding:0 .4rem .35rem}
html[lang="zh-CN"] .rank-head{text-transform:none;letter-spacing:.15em}
.rank-row{
  width:100%;border:none;background:none;cursor:pointer;text-align:left;
  padding:.42rem .4rem;border-top:1px solid var(--line);font-size:.875rem;
}
.rank-row:hover{background:#fff}
.rank-row.sel{background:#fff;box-shadow:inset 2px 0 0 var(--ink)}
.rank-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:8px;border-radius:2px;background:transparent}
.bar::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line-strong)}
.bar i{position:absolute;top:0;bottom:0;border-radius:2px}
.bar i.pos{left:50%}
.bar i.neg{right:50%}
.rank-c{text-align:right;font-variant-numeric:tabular-nums}
.rank-r{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-soft)}

.higher{margin:0 0 2.25rem}
.higher-row{
  display:grid;grid-template-columns:12px 1fr 3.4rem 3.2rem;gap:.6rem;align-items:center;
  padding:.5rem .4rem;border-top:1px solid var(--line);font-size:.9375rem;
}
.border-note{font-size:.8125rem;color:var(--ink-soft);margin:.75rem 0 0}

.export-row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin:0 0 2.5rem}
.method-note{font-size:.8125rem;color:var(--ink-soft)}

footer.applique{max-width:36rem;margin:0 auto;padding:0 1.25rem 3rem;font-size:.75rem;color:var(--ink-soft)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || typeof s !== 'object') return null;
    const st = {
      screen: ['start','items','review','results'].includes(s.screen) ? s.screen : 'start',
      lang: s.lang === 'zh' ? 'zh' : 'en',
      gender: s.gender === 'm' || s.gender === 'f' ? s.gender : null,
      cursor: Number.isInteger(s.cursor) && s.cursor >= 1 && s.cursor <= 57 ? s.cursor : 1,
      answers: {},
    };
    if(s.answers && typeof s.answers === 'object'){
      for(let n = 1; n <= 57; n++){
        const v = s.answers[String(n)];
        if(Number.isInteger(v) && v >= 1 && v <= 6) st.answers[String(n)] = v;
      }
    }
    return st;
  }catch(e){
    try{ localStorage.removeItem(KEY); }catch(e2){ storageOK = false; }
    return null;
  }
}

};

/* ---------- scoring (pure) ---------- */
function score(answers){
  let sum = 0;
  for(let n = 1; n <= 57; n++) sum += answers[String(n)];
  const mrat = sum / 57;
  const values = CIRCLE.map(v => {
    const raw = v.items.reduce((s,i)=>s+answers[String(i)],0) / 3;
    return { id: v.id, raw, centered: raw - mrat };
  });
  const byId = {}; values.forEach(s=>{byId[s.id]=s;});
  const higher = DATA.higher_order.map(h => {
    const raw = h.combine.reduce((s,id)=>s+byId[id].raw,0) / h.combine.length;
    return { id: h.id, raw, centered: raw - mrat };
  });
  return { mrat, values, byId, higher };
}

/* ---------- wheel ---------- */
const CX=320, CY=320, ZR=170, INR=64, OUTR=276, SPAN=106, SEC=360/19, GAP=1.5;
function XY(th, r){
  const a = th * Math.PI / 180;
  return [CX + r * Math.sin(a), CY - r * Math.cos(a)];
}
function P(th, r){ const [x,y] = XY(th,r); return x.toFixed(2)+' '+y.toFixed(2); }
function wedge(a1, a2, rI, rO){
  return 'M '+P(a1,rO)+' A '+rO+' '+rO+' 0 0 1 '+P(a2,rO)+
         ' L '+P(a2,rI)+' A '+rI+' '+rI+' 0 0 0 '+P(a1,rI)+' Z';
}
const QUAD_SPANS = [
  {id:'openness', from:0, to:4},
  {id:'enhancement', from:4, to:7},
  {id:'conservation', from:8, to:13},
  {id:'transcendence', from:14, to:19},
];
function buildWheel(sc){
  let g = '';
  // dashed zero-ring + tiny 0
  g += '<circle cx="'+CX+'" cy="'+CY+'" r="'+ZR+'" fill="none" stroke="var(--line-strong)" stroke-dasharray="3 4"/>';
  g += '<text x="'+(CX+7)+'" y="'+(CY-ZR-5)+'" font-size="10" fill="var(--line-strong)">0</text>';
  // quadrant arc bands (face & humility deliberately unbanded)
  for(const q of QUAD_SPANS){
    const a1 = q.from*SEC + GAP/2, a2 = q.to*SEC - GAP/2;
    g += '<path d="M '+P(a1,291)+' A 291 291 0 0 1 '+P(a2,291)+'" fill="none" stroke="var(--q-'+q.id+')" stroke-width="6" stroke-linecap="round"/>';
    const right = q.id === 'openness' || q.id === 'enhancement';
    const top = q.id === 'openness' || q.id === 'transcendence';
    const name = DATA.higher_order.find(h=>h.id===q.id).name[state.lang];
    g += '<text class="qname" x="'+(right?610:30)+'" y="'+(top?40:610)+'" text-anchor="'+(right?'end':'start')+'" fill="var(--q-'+q.id+')">'+esc(name)+'</text>';
  }
  // sectors + rim labels
  let hits = '';
  for(const v of CIRCLE){
    const s = sc.byId[v.id];
    const k = v.order;
    const a1 = k*SEC + GAP/2, a2 = (k+1)*SEC - GAP/2, mid = (k+0.5)*SEC;
    const cl = Math.max(-2.5, Math.min(2.5, s.centered));
    const r = ZR + cl/2.5*SPAN;
    let rI = Math.min(ZR, r), rO = Math.max(ZR, r);
    if(rO - rI < 2){ rO = rI + 2; }
    const [ox, oy] = XY(mid, ZR);
    g += '<path class="sector'+(s.centered<0?' neg':'')+(sel===v.id?' sel':'')+'" id="sec-'+v.id+
         '" d="'+wedge(a1,a2,rI,rO)+'" fill="var('+hueVar(v)+')" style="transform-origin:'+
         ox.toFixed(1)+'px '+oy.toFixed(1)+'px;animation-delay:'+(k*30)+'ms"/>';
    hits += '<path class="hit" d="'+wedge(a1,a2,INR,OUTR)+'" data-action="pick" data-value="'+v.id+
            '"><title>'+esc(v.name[state.lang])+' · '+fmt2s(s.centered)+'</title></path>';
    // rim label(s)
    const name = v.name[state.lang];
    let lines;
    if(state.lang === 'en' && name.includes('–')){
      const i = name.indexOf('–');
      lines = [name.slice(0, i+1), name.slice(i+1)];
    } else lines = [name];
    const flip = mid > 90 && mid < 270;
    const rot = flip ? mid - 180 : mid;
    const radii = lines.length === 1 ? [306] : (flip ? [300, 312] : [312, 300]);
    lines.forEach((ln, li)=>{
      const [lx, ly] = XY(mid, radii[li]);
      g += '<text class="rim-label" x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+
           '" text-anchor="middle" dominant-baseline="middle" transform="rotate('+rot.toFixed(2)+' '+lx.toFixed(1)+' '+ly.toFixed(1)+')">'+esc(ln)+'</text>';
    });
  }
  // center readout
  g += '<text id="hub-name" class="hub-name" x="'+CX+'" y="'+(CY-8)+'" text-anchor="middle">MRAT</text>';
  g += '<text id="hub-num" class="hub-num" x="'+CX+'" y="'+(CY+18)+'" text-anchor="middle">'+fmt2(sc.mrat)+'</text>';
  g += hits;
  return '<svg viewBox="0 0 640 640" role="img" aria-label="Schwartz value circumplex">'+g+'</svg>';
}

function pick(id){
  sel = id;
  const sc = lastScore || score(state.answers);
  document.getElementById('detail').innerHTML = detailCard(id, sc);
  document.querySelectorAll('.sector').forEach(p=>p.classList.toggle('sel', p.id === 'sec-'+id));
  document.querySelectorAll('.rank-row').forEach(b=>b.classList.toggle('sel', b.dataset.value === id));
  setHub(id, sc);
}
function setHub(id, sc){
  const nameEl = document.getElementById('hub-name');
  const numEl = document.getElementById('hub-num');
  if(!nameEl || !numEl) return;
  if(id){
    nameEl.textContent = VBYID[id].name[state.lang];
    numEl.textContent = fmt2s(sc.byId[id].centered);
  } else {
    nameEl.textContent = 'MRAT';
    numEl.textContent = fmt2(sc.mrat);
  }
}

/* ---------- exports ---------- */
function csvField(s){
  s = String(s);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function download(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function exportCSV(){
  const sc = score(state.answers);
  const rows = ['type,id,label,raw,centered'];
  for(let n=1;n<=57;n++){
    rows.push('answer,'+n+','+csvField(DATA.items[state.lang][state.gender][n-1])+','+state.answers[String(n)]+',');
  }
  rows.push('mrat,,MRAT,'+fmt4(sc.mrat)+',');
  for(const s of sc.values){
    rows.push('value,'+s.id+','+csvField(VBYID[s.id].name[state.lang])+','+fmt4(s.raw)+','+fmt4(s.centered));
  }
  for(const h of sc.higher){
    const hd = DATA.higher_order.find(x=>x.id===h.id);
    rows.push('higher,'+h.id+','+csvField(hd.name[state.lang])+','+fmt4(h.raw)+','+fmt4(h.centered));
  }
  download('pvqrr-results.csv', new Blob(['\uFEFF'+rows.join('\r\n')], {type:'text/csv;charset=utf-8'}));
}
function exportJSON(){
  const sc = score(state.answers);
  const obj = {
    exported_at: new Date().toISOString(),
    instrument: 'PVQ-RR',
    lang: state.lang,
    gender: state.gender,
    answers: state.answers,
    mrat: sc.mrat,
    values: sc.values.map(s=>({id:s.id, raw:s.raw, centered:s.centered})),
    higher_order: sc.higher.map(h=>({id:h.id, raw:h.raw, centered:h.centered})),
  };
  download('pvqrr-results.json', new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'}));
}
function exportPNG(){
  const sc = score(state.answers);
  const css = getComputedStyle(document.documentElement);
  const C = n => css.getPropertyValue(n).trim();
  const zh = state.lang === 'zh';
  const serif = zh ? '"Songti SC","Noto Serif CJK SC","SimSun",serif' : 'Literata,Georgia,serif';
  const sans = zh ? '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif' : '"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif';
  const hdr = s => zh ? s : s.toUpperCase();
  const W = 960, pad = 56, colX = 530, colW = W - pad - colX;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const wrap = (text, maxW) => {
    const parts = zh ? Array.from(text) : text.split(' ');
    const join = zh ? '' : ' ';
    const lines = [];
    let cur = '';
    for(const p of parts){
      const test = cur ? cur + join + p : p;
      if(ctx.measureText(test).width > maxW && cur){ lines.push(cur); cur = p; }
      else cur = test;
    }
    if(cur) lines.push(cur);
    return lines;
  };
  // measure pass (layout depends on wrapped line counts)
  ctx.font = '400 15px ' + sans;
  const mratLines = wrap(t('mrat_line',{x:fmt2(sc.mrat)}), W - 2*pad);
  ctx.font = '400 12px ' + sans;
  const borderLines = wrap(t('border_note'), W - 2*pad);
  const methodLines = wrap(t('method_note'), W - 2*pad);
  ctx.font = '400 11px ' + sans;
  const licenseLines = wrap(t('footer_license'), W - 2*pad);
  const headerBottom = 152 + (mratLines.length - 1) * 22;
  const ws = 0.75, wcx = 260, wcy = headerBottom + 244;
  const wheelBottom = wcy + 244;
  const rankTop = headerBottom + 26, rowH = 24;
  const rankBottom = rankTop + 14 + 19 * rowH;
  const higherTop = Math.max(wheelBottom, rankBottom) + 44;
  const borderTop = higherTop + 24 + 4 * 26 + 14;
  const methodTop = borderTop + borderLines.length * 18 + 16;
  const licTop = methodTop + methodLines.length * 18 + 14;
  const H = licTop + licenseLines.length * 18 + pad - 14;
  canvas.width = W * 2; canvas.height = H * 2;
  ctx.scale(2, 2);
  ctx.fillStyle = C('--paper'); ctx.fillRect(0, 0, W, H);
  // header
  ctx.fillStyle = C('--ink-soft');
  ctx.font = '600 12px ' + sans;
  ctx.fillText(hdr('PVQ-RR · ' + new Date().toISOString().slice(0, 10)), pad, 64);
  ctx.fillStyle = C('--ink');
  ctx.font = '600 30px ' + serif;
  ctx.fillText(t('results_title'), pad, 104);
  ctx.font = '400 15px ' + sans;
  mratLines.forEach((ln, i) => ctx.fillText(ln, pad, 132 + i * 22));
  // wheel
  const pt = (th, r) => [wcx + r * Math.sin(th * Math.PI / 180), wcy - r * Math.cos(th * Math.PI / 180)];
  const rad = th => (th - 90) * Math.PI / 180;
  ctx.strokeStyle = C('--line-strong'); ctx.setLineDash([3, 4]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(wcx, wcy, ZR * ws, 0, 2 * Math.PI); ctx.stroke();
  ctx.setLineDash([]);
  for(const q of QUAD_SPANS){
    const a1 = q.from * SEC + GAP / 2, a2 = q.to * SEC - GAP / 2;
    ctx.strokeStyle = C('--q-' + q.id); ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(wcx, wcy, 291 * ws, rad(a1), rad(a2)); ctx.stroke();
    ctx.fillStyle = C('--q-' + q.id); ctx.font = '600 15px ' + sans;
    const right = q.id === 'openness' || q.id === 'enhancement';
    const top = q.id === 'openness' || q.id === 'transcendence';
    ctx.textAlign = right ? 'right' : 'left';
    ctx.fillText(DATA.higher_order.find(h => h.id === q.id).name[state.lang],
      right ? colX - 34 : 26, top ? headerBottom + 34 : wheelBottom - 20);
  }
  for(const v of CIRCLE){
    const sv = sc.byId[v.id], k = v.order;
    const a1 = k * SEC + GAP / 2, a2 = (k + 1) * SEC - GAP / 2, mid = (k + 0.5) * SEC;
    const cl = Math.max(-2.5, Math.min(2.5, sv.centered));
    const r = (ZR + cl / 2.5 * SPAN) * ws;
    let rI = Math.min(ZR * ws, r), rO = Math.max(ZR * ws, r);
    if(rO - rI < 1.5) rO = rI + 1.5;
    ctx.fillStyle = C(hueVar(v));
    ctx.globalAlpha = sv.centered < 0 ? 0.45 : 1;
    ctx.beginPath();
    ctx.arc(wcx, wcy, rO, rad(a1), rad(a2));
    ctx.arc(wcx, wcy, rI, rad(a2), rad(a1), true);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    const name = v.name[state.lang];
    const lines = (!zh && name.includes('–'))
      ? [name.slice(0, name.indexOf('–') + 1), name.slice(name.indexOf('–') + 1)]
      : [name];
    const flip = mid > 90 && mid < 270;
    const rot = (flip ? mid - 180 : mid) * Math.PI / 180;
    const radii = lines.length === 1 ? [306 * ws] : (flip ? [300 * ws, 312 * ws] : [312 * ws, 300 * ws]);
    ctx.fillStyle = C('--ink-soft'); ctx.font = '400 ' + (zh ? 13 : 10) + 'px ' + sans; ctx.textAlign = 'center';
    lines.forEach((ln, li) => {
      const [lx, ly] = pt(mid, radii[li]);
      ctx.save(); ctx.translate(lx, ly); ctx.rotate(rot); ctx.fillText(ln, 0, 3); ctx.restore();
    });
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = C('--ink-soft'); ctx.font = '500 10px ' + sans;
  ctx.fillText('MRAT', wcx, wcy - 6);
  ctx.fillStyle = C('--ink'); ctx.font = '500 18px ' + sans;
  ctx.fillText(fmt2(sc.mrat), wcx, wcy + 14);
  // ranked list
  const ranked = sc.values.slice().sort((a, b) => b.centered - a.centered);
  ctx.textAlign = 'left'; ctx.fillStyle = C('--ink-soft'); ctx.font = '600 10px ' + sans;
  ctx.fillText(hdr(t('col_value')), colX + 18, rankTop + 8);
  ctx.textAlign = 'right';
  ctx.fillText(hdr(t('col_centered')), colX + 322, rankTop + 8);
  ctx.fillText(hdr(t('col_raw')), colX + colW, rankTop + 8);
  const barX = colX + 186, barW = 84;
  ranked.forEach((sv, i) => {
    const top = rankTop + 14 + i * rowH, ry = top + 16;
    const v = VBYID[sv.id];
    if(i){ ctx.fillStyle = C('--line'); ctx.fillRect(colX, top, colW, 1); }
    ctx.fillStyle = C(hueVar(v));
    ctx.fillRect(colX, ry - 9, 10, 10);
    ctx.fillStyle = C('--ink'); ctx.font = '400 12px ' + sans; ctx.textAlign = 'left';
    let nm = v.name[state.lang];
    while(ctx.measureText(nm).width > 160 && nm.length > 2) nm = nm.slice(0, -2) + '…';
    ctx.fillText(nm, colX + 18, ry);
    ctx.fillStyle = C('--line-strong'); ctx.fillRect(barX + barW / 2, ry - 11, 1, 14);
    const bw = Math.min(Math.abs(sv.centered), 2.5) / 2.5 * (barW / 2);
    ctx.fillStyle = C(hueVar(v));
    ctx.fillRect(sv.centered >= 0 ? barX + barW / 2 : barX + barW / 2 - bw, ry - 8, bw, 8);
    ctx.textAlign = 'right';
    ctx.fillStyle = C('--ink'); ctx.fillText(fmt2s(sv.centered), colX + 322, ry);
    ctx.fillStyle = C('--ink-soft'); ctx.fillText(fmt2(sv.raw), colX + colW, ry);
  });
  // higher-order block
  ctx.textAlign = 'left'; ctx.fillStyle = C('--ink-soft'); ctx.font = '600 11px ' + sans;
  ctx.fillText(hdr(t('higher_title')), pad, higherTop + 12);
  sc.higher.forEach((h, i) => {
    const top = higherTop + 24 + i * 26, ry = top + 17;
    const hd = DATA.higher_order.find(x => x.id === h.id);
    ctx.fillStyle = C('--line'); ctx.fillRect(pad, top, W - 2 * pad, 1);
    ctx.fillStyle = C('--q-' + h.id);
    ctx.fillRect(pad, ry - 9, 10, 10);
    ctx.fillStyle = C('--ink'); ctx.font = '400 13px ' + sans; ctx.textAlign = 'left';
    ctx.fillText(hd.name[state.lang], pad + 18, ry);
    ctx.textAlign = 'right';
    ctx.fillText(fmt2s(h.centered), W - pad - 52, ry);
    ctx.fillStyle = C('--ink-soft'); ctx.fillText(fmt2(h.raw), W - pad, ry);
  });
  // notes
  ctx.textAlign = 'left'; ctx.fillStyle = C('--ink-soft');
  ctx.font = '400 12px ' + sans;
  borderLines.forEach((ln, i) => ctx.fillText(ln, pad, borderTop + i * 18));
  methodLines.forEach((ln, i) => ctx.fillText(ln, pad, methodTop + i * 18));
  ctx.font = '400 11px ' + sans;
  licenseLines.forEach((ln, i) => ctx.fillText(ln, pad, licTop + i * 18));
  canvas.toBlob(b => { if(b) download('pvqrr-results.png', b); }, 'image/png');
}

/* ---------- navigation ---------- */
function clearAdvance(){ if(advanceTimer){ clearTimeout(advanceTimer); advanceTimer = null; } }
function goItem(n){
  clearAdvance();
  state.cursor = n; state.screen = 'items';
  save(); render();
}
function nextFrom(n){
  clearAdvance();
  if(n >= 57){ state.screen = 'review'; }
  else { state.cursor = n + 1; }
  save(); render();
}
function answer(r){
  if(state.screen !== 'items') return;
  const n = state.cursor;
  clearAdvance();
  state.answers[String(n)] = r;
  save(); render();
  advanceTimer = setTimeout(()=>nextFrom(n), RM.matches ? 0 : 220);
}
function startOver(){
  if(!confirm(t('confirm_clear'))) return;
  clearAdvance();
  state.answers = {}; state.gender = null; state.cursor = 1; state.screen = 'start';
  wordingWarn = false;
  save(); render();
}

/* ---------- events ---------- */
document.body.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const act = el.dataset.action;
  if(act === 'lang'){ state.lang = el.dataset.lang; save(); render(); }
  else if(act === 'wording'){ state.gender = el.dataset.g; wordingWarn = false; save(); render(); }
  else if(act === 'begin'){
    if(!state.gender){ wordingWarn = true; render(); return; }
    goItem(firstUnanswered() || 1);
  }
  else if(act === 'resume'){
    if(!state.gender){ wordingWarn = true; render(); return; }
    const n = firstUnanswered();
    if(n === null){ state.screen = 'review'; save(); render(); }
    else goItem(n);
  }
  else if(act === 'startover'){ startOver(); }
  else if(act === 'answer'){ answer(Number(el.dataset.rating)); }
  else if(act === 'back'){ if(state.cursor > 1) goItem(state.cursor - 1); }
  else if(act === 'goto'){ goItem(Number(el.dataset.n)); }
  else if(act === 'results'){ state.screen = 'results'; save(); render(); }
  else if(act === 'pick'){ pick(el.dataset.value); }
  else if(act === 'csv'){ exportCSV(); }
  else if(act === 'json'){ exportJSON(); }
  else if(act === 'png'){ exportPNG(); }
});
document.body.addEventListener('mouseover', e=>{
  if(!FINE.matches || state.screen !== 'results') return;
  const el = e.target.closest('.hit');
  if(!el || !lastScore) return;
  document.getElementById('detail').innerHTML = detailCard(el.dataset.value, lastScore);
  setHub(el.dataset.value, lastScore);
});
document.body.addEventListener('mouseout', e=>{
  if(!FINE.matches || state.screen !== 'results' || !lastScore) return;
  const el = e.target.closest('.hit');
  if(!el) return;
  document.getElementById('detail').innerHTML = detailCard(sel, lastScore);
  setHub(sel, lastScore);
});
document.addEventListener('keydown', e=>{
  if(state.screen !== 'items') return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key >= '1' && e.key <= '6'){ answer(Number(e.key)); }
  else if(e.key === 'ArrowLeft'){ if(state.cursor > 1) goItem(state.cursor - 1); }
  else if(e.key === 'ArrowRight'){ if(state.answers[String(state.cursor)]) nextFrom(state.cursor); }
});

render();
</script>
</body>
</html>
